name: Android APK Release

on:
  push:
    tags:
      - "v*"
      - "android-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (e.g. v0.1.0)"
        required: true
        type: string

concurrency:
  group: android-apk-release-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  SOURCE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}

jobs:
  publish-android-apk:
    permissions:
      contents: write
      packages: read
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

      - name: Resolve release tag
        shell: bash
        run: node scripts/emit-release-env.mjs --source-tag "$SOURCE_TAG" >> "$GITHUB_ENV"

      - name: Ensure GitHub release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            exit 0
          fi

          release_args=(
            release create "$RELEASE_TAG"
            --repo "${{ github.repository }}"
            --title "Paseo $RELEASE_TAG"
            --notes ""
          )

          if [[ "$IS_PRERELEASE" == "true" ]]; then
            release_args+=(--prerelease)
          fi

          if ! gh "${release_args[@]}"; then
            echo "Release creation raced with another workflow; continuing."
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          registry-url: "https://npm.pkg.github.com"
          scope: "@boudra"

      - name: Install JS dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            package-lock.json
            packages/app/android/**/*.gradle*
            packages/app/android/gradle/wrapper/gradle-wrapper.properties

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore Expo and Metro caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/expo
            ~/.cache/metro
            ~/.expo
            packages/app/.expo
          key: ${{ runner.os }}-expo-metro-android-${{ hashFiles('package-lock.json', 'packages/app/app.config.js', 'packages/app/package.json', 'packages/app/index.ts') }}
          restore-keys: |
            ${{ runner.os }}-expo-metro-android-

      - name: Build workspace dependencies
        run: npm run build:workspace-deps --workspace=@getpaseo/app

      - name: Prebuild Android project
        shell: bash
        run: |
          set -euo pipefail
          cd packages/app

          APP_VARIANT=production npx expo prebuild --platform android --non-interactive --clean

      - name: Build Android release APK
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          cd packages/app/android

          ./gradlew :app:assembleRelease \
            --build-cache \
            -x lint \
            -x lintVitalAnalyzeRelease \
            -x lintVitalRelease \
            -x generateReleaseLintModel \
            -x generateReleaseLintVitalModel

          asset_name="paseo-${RELEASE_TAG}-android.apk"
          asset_path="$RUNNER_TEMP/$asset_name"

          apk_path="$(find app/build/outputs/apk/release -name '*.apk' -print -quit)"
          if [ -z "$apk_path" ]; then
            echo "Failed to find release APK."
            find app/build/outputs -maxdepth 5 -type f -print
            exit 1
          fi

          cp "$apk_path" "$asset_path"

          echo "asset_name=$asset_name" >> "$GITHUB_OUTPUT"
          echo "asset_path=$asset_path" >> "$GITHUB_OUTPUT"

      - name: Upload APK to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$RELEASE_TAG" "${{ steps.artifact.outputs.asset_path }}" --clobber --repo "${{ github.repository }}"
